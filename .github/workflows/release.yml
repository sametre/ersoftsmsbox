name: Release & Deploy

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: .NET 8 kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Sürüm numarasını al
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart('v')
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Sürüm: $ver"

      - name: AppVersion.cs güncelle
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $file = "AppVersion.cs"
          $content = Get-Content $file -Raw
          $content = $content -replace 'Current\s*=\s*"[^"]+"', "Current = `"$ver`""
          Set-Content $file $content -Encoding UTF8
          echo "AppVersion güncellendi: $ver"

      - name: Derleme (publish_output)
        shell: pwsh
        run: |
          dotnet publish ERSoftSMSBox.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish_output `
            --nologo

      - name: Setup EXE oluştur (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Warning "Inno Setup bulunamadı, setup.exe atlanıyor"
          } else {
            # setup.iss içindeki version ve publish dir güncelle
            $ver = "${{ steps.version.outputs.VERSION }}"
            $iss = Get-Content setup.iss -Raw
            $iss = $iss -replace '#define AppVersion ".*?"', "#define AppVersion `"$ver`""
            Set-Content setup.iss $iss -Encoding UTF8
            New-Item -ItemType Directory -Force -Path installer_output | Out-Null
            & $iscc setup.iss
            if ($LASTEXITCODE -eq 0) {
              $f = Get-ChildItem installer_output\*.exe | Select-Object -First 1
              echo "Setup EXE: $($f.Name) ($([math]::Round($f.Length/1MB,1)) MB)"
              Rename-Item $f.FullName "ERSoftSMSBox-Setup-v$ver.exe"
            } else {
              Write-Error "Inno Setup derleme hatası"
            }
          }

      - name: ZIP oluştur (güncelleme paketi)
        shell: pwsh
        run: |
          Compress-Archive -Path "publish_output\*" -DestinationPath "ERSoftSMSBox.zip" -CompressionLevel Optimal
          $mb = [math]::Round((Get-Item ERSoftSMSBox.zip).Length / 1MB, 1)
          echo "ZIP boyutu: $mb MB"

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "ERSoftSMSBox ${{ github.ref_name }}"
          body: |
            ## ERSoftSMSBox ${{ github.ref_name }}

            ### Kurulum
            - **ERSoftSMSBox-Setup-v*.exe** → Yeni kurulum için setup dosyası
            - **ERSoftSMSBox.zip** → Otomatik güncelleme paketi (uygulama içinden kullanılır)

            ### Gereksinimler
            - .NET 8 Desktop Runtime (x64)
            - Windows 10/11 x64
          files: |
            installer_output/ERSoftSMSBox-Setup-v${{ steps.version.outputs.VERSION }}.exe
            ERSoftSMSBox.zip
          draft: false
          prerelease: false

      - name: Güncelleme sunucusuna yükle
        shell: pwsh
        env:
          UPLOAD_SECRET: ${{ secrets.UPLOAD_SECRET }}
          SERVER_URL: ${{ vars.UPDATE_SERVER_URL }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $serverUrl = if ($env:SERVER_URL) { $env:SERVER_URL } else { "http://temasre.shop" }
          $ver    = $env:VERSION
          $tag    = "${{ github.ref_name }}"
          $notes  = "GitHub Actions ile otomatik derlendi. Tag: $tag"

          $filePath  = "ERSoftSMSBox.zip"
          $fileBytes = [System.IO.File]::ReadAllBytes($filePath)
          $boundary  = [System.Guid]::NewGuid().ToString()
          $encoding  = [System.Text.Encoding]::UTF8

          $body   = [System.IO.MemoryStream]::new()
          $writer = [System.IO.StreamWriter]::new($body, $encoding)

          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"version`"`r`n`r`n")
          $writer.Write("$ver`r`n")
          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"notes`"`r`n`r`n")
          $writer.Write("$notes`r`n")
          $writer.Write("--$boundary`r`n")
          $writer.Write("Content-Disposition: form-data; name=`"package`"; filename=`"ERSoftSMSBox.zip`"`r`n")
          $writer.Write("Content-Type: application/zip`r`n`r`n")
          $writer.Flush()
          $body.Write($fileBytes, 0, $fileBytes.Length)
          $writer.Write("`r`n--$boundary--`r`n")
          $writer.Flush()
          $bodyBytes = $body.ToArray()
          $body.Dispose()

          $resp = Invoke-RestMethod `
            -Uri "$serverUrl/upload" `
            -Method Post `
            -Body $bodyBytes `
            -ContentType "multipart/form-data; boundary=$boundary" `
            -Headers @{ "X-Upload-Key" = $env:UPLOAD_SECRET } `
            -TimeoutSec 120

          Write-Host "✓ Sürüm $ver sunucuya yüklendi ($([math]::Round($resp.size/1MB,1)) MB)"

      - name: Temizlik
        if: always()
        shell: pwsh
        run: |
          Remove-Item publish_output -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item installer_output -Recurse -Force -ErrorAction SilentlyContinue
